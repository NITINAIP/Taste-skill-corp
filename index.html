<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#081524" media="(prefers-color-scheme: dark)" />
    <title>อารักษ์ โบรกเกอร์ | นายหน้าประกันภัยที่อยู่ข้างคุณ</title>
    <meta
      name="description"
      content="นายหน้าประกันวินาศภัยที่ได้รับใบอนุญาตจาก คปภ. เปรียบเทียบประกันรถยนต์ สุขภาพ อัคคีภัย และประกันธุรกิจ พร้อมทีมดูแลเคลมตลอดอายุกรมธรรม์"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Applies the stored theme before first paint so the page never flashes
      // the wrong surface. Kept inline and tiny on purpose; the real theme state
      // lives in src/providers/theme-provider.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("arak-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored !== "light" && stored !== "system" && stored === null ? false : stored === "system" ? prefersDark : stored === "dark");
          if (stored === null) dark = false;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
