    </g>
    <rect x="0" y="1032" width="1600" height="99" fill="#e8940c" fill-opacity="0.9"/>
    <circle cx="419" cy="742" r="545" fill="none" stroke="#e8940c" stroke-opacity="0.55" stroke-width="9.6"/>
    <circle cx="1432" cy="1229" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="8.0"/>
  </g>
</svg>
