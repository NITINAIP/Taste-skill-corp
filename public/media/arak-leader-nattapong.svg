    <rect width="1600" height="1600" fill="url(#grid)"/>
    <g filter="url(#soft)">
      <circle cx="1396" cy="1511" r="1074" fill="#26609f" fill-opacity="0.291"/>
      <circle cx="1223" cy="702" r="1000" fill="#26609f" fill-opacity="0.338"/>
