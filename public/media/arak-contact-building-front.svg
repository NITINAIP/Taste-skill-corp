    <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#g)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <g filter="url(#soft)">
      <circle cx="816" cy="177" r="520" fill="#1d4b80" fill-opacity="0.228"/>
      <circle cx="930" cy="161" r="520" fill="#1d4b80" fill-opacity="0.173"/>
      <circle cx="249" cy="506" r="457" fill="#1d4b80" fill-opacity="0.357"/>
    </g>
    <rect x="0" y="444" width="1600" height="52" fill="#e8940c" fill-opacity="0.9"/>
    <circle cx="1109" cy="395" r="293" fill="none" stroke="#e8940c" stroke-opacity="0.55" stroke-width="5.4"/>
    <circle cx="1156" cy="703" r="161" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4.5"/>
  </g>
</svg>
