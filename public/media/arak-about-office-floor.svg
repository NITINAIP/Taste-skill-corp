    <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#g)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <g filter="url(#soft)">
      <circle cx="643" cy="529" r="600" fill="#1d4b80" fill-opacity="0.350"/>
      <circle cx="1201" cy="534" r="437" fill="#1d4b80" fill-opacity="0.234"/>
      <circle cx="589" cy="527" r="608" fill="#1d4b80" fill-opacity="0.356"/>
    </g>
    <rect x="0" y="402" width="1600" height="37" fill="#e8940c" fill-opacity="0.9"/>
    <circle cx="936" cy="284" r="266" fill="none" stroke="#e8940c" stroke-opacity="0.55" stroke-width="5.4"/>
    <circle cx="1226" cy="758" r="146" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4.5"/>
  </g>
</svg>
