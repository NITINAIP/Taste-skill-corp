    <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#g)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <g filter="url(#soft)">
      <circle cx="337" cy="240" r="346" fill="#1d4b80" fill-opacity="0.310"/>
      <circle cx="565" cy="853" r="331" fill="#1d4b80" fill-opacity="0.359"/>
      <circle cx="447" cy="443" r="645" fill="#1d4b80" fill-opacity="0.254"/>
    </g>
    <rect x="0" y="635" width="1600" height="32" fill="#e8940c" fill-opacity="0.9"/>
    <circle cx="1022" cy="313" r="225" fill="none" stroke="#e8940c" stroke-opacity="0.55" stroke-width="5.4"/>
    <circle cx="1191" cy="744" r="124" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4.5"/>
  </g>
</svg>
