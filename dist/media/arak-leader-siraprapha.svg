    <circle cx="446" cy="1008" r="320" fill="none" stroke="#e8940c" stroke-opacity="0.55" stroke-width="9.6"/>
    <circle cx="1421" cy="1096" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="8.0"/>
  </g>
